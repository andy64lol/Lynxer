[package]
name = "wynxer"
version = "0.1.0"
edition = "2021"
description = "A Lynxer-like language for the web: compiles to JS, WASM, HTML and CSS."
license = "MIT"
authors = ["Andy <andy64lolxd@gmail.com>"]
repository = "https://github.com/andy64lol/Lynxer"

# Wynxer is a separate binary from lynxer. It targets the web: JS and WASM
# for logic, HTML (generated from .wpf) and CSS for presentation. It never
# requires hand-written HTML.
[[bin]]
name = "wynxer"
path = "src/main.rs"

[lib]
name = "wynxer"
path = "src/lib.rs"

[dependencies]
# Deliberately kept minimal for the 0.1.0 scaffold. Codegen backends, the
# WASM emitter and the .wpf parser land in later versions (see todo.md).
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
strip = true

[profile.dev]
opt-level = 0
