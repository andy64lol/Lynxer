name: Build Bob on Windows AMD64

# Bob is the Lynxer package manager, a separate Rust component (see
# Bob/README.md). It has its own workflows and is no longer built by the Lynxer
# ones; like the rest of CI they run on every push and pull request to main.
#
# Bob needs no C toolchain, so this installs only `make` plus a Rust toolchain
# from MSYS2 MINGW64 (its Makefile uses POSIX tools for the self-check).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and self-check Bob on Windows AMD64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (MINGW64) with make and Rust
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            coreutils
            diffutils
            mingw-w64-x86_64-rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Bob -> target

      - name: Build and self-check Bob
        shell: msys2 {0}
        run: make -C Bob test

      - name: Run the Windows binary natively, outside MSYS2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bob = Join-Path $env:GITHUB_WORKSPACE "Bob\target\release\bob.exe"
          if (-not (Test-Path $bob)) { throw "bob.exe was not built" }
          $dir = Join-Path $env:RUNNER_TEMP "bob-native"
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Push-Location $dir
          & $bob --ver
          & $bob --init
          & $bob --init --module
          foreach ($file in @("bob\bob.toml", "bob\bob-lock.toml", "module.toml", "src\main.lynx")) {
            if (-not (Test-Path $file)) { throw "bob did not create $file" }
          }
          Pop-Location
          Write-Host "bob.exe ran natively with Windows paths"

      - name: Upload the Bob binary
        uses: actions/upload-artifact@v4
        with:
          name: bob-windows-amd64
          path: Bob/target/release/bob.exe
          if-no-files-found: error
