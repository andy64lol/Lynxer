# Build Lynxer Arch package and push to andy-repo
name: Build and Push to Andy-Repo

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lynxer repository
        uses: actions/checkout@v4

      - name: Build Lynxer package
        run: |
          docker run --rm -v "$(pwd)":/src -w /src/packaging/aur/lynxer archlinux:latest \
            bash -c "pacman -Syu --noconfirm --needed base-devel clang curl git rust pkgconf cmake libffi alsa-lib bzip2 libglvnd libx11 libxext libxrandr libxi libxinerama libxcursor libxxf86vm && useradd -m builder && chown -R builder:builder /src/packaging/aur/lynxer && su builder -c 'makepkg --noconfirm'"

      - name: Locate the built package
        run: |
          PACKAGE_FILE=$(basename packaging/aur/lynxer/lynxer-*.pkg.tar.zst)
          echo "PACKAGE_FILE=$PACKAGE_FILE" >> "$GITHUB_ENV"

      - name: Authenticate and checkout andy-repo
        env:
          ANDY_REPO_TOKEN: ${{ secrets.ANDY_REPO_TOKEN }}
        run: node .github/scripts/checkout-andy-repo.mjs

      - name: Copy package to andy-repo
        run: |
          cp "packaging/aur/lynxer/${{ env.PACKAGE_FILE }}" andy-repo/

      - name: Commit and push package to andy-repo
        env:
          ANDY_REPO_TOKEN: ${{ secrets.ANDY_REPO_TOKEN }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_ASKPASS: ${{ github.workspace }}/.github/scripts/git-askpass.sh
          GIT_TERMINAL_PROMPT: '0'
        run: |
          docker run --rm \
            -e PACKAGE_FILE="${{ env.PACKAGE_FILE }}" \
            -v "$(pwd)":/src -w /src/andy-repo archlinux:latest \
            bash -ec 'repo-add lynxer.db.tar.gz "$PACKAGE_FILE"'
          cd andy-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add lynxer.db lynxer.db.tar.gz lynxer.files lynxer.files.tar.gz "${{ env.PACKAGE_FILE }}"
          if git diff --cached --quiet; then
            echo "Package repository is already up to date."
            exit 0
          fi
          git commit -m "Update Lynxer package to latest version"
          git -c credential.helper= push
