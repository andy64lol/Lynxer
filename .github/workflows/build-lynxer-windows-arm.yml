name: Build Lynxer on Windows ARM64 (experimental)

# The Windows port is in progress (see docs/windows.md). This job attempts a
# real build and test on an ARM64 Windows runner so progress and breakage stay
# visible, and it is allowed to fail while the port is incomplete. Remove the
# `continue-on-error` on the job once it is green.
#
# It builds inside MSYS2 CLANGARM64, the ARM64 environment where the C++
# compiler is clang, so the C++ build, `make` and the Rust toolchain share the
# same ABI.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Attempt build and test on Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (CLANGARM64) with clang, make, libffi and Rust
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            make
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-libffi
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lynxer/rust -> ../build/rust

      - name: Show the toolchain
        shell: msys2 {0}
        run: |
          uname -a
          clang++ --version | head -1
          make --version | head -1
          cargo --version
          pkg-config --modversion libffi || true

      - name: Build Lynxer (attempt)
        shell: msys2 {0}
        run: make buildLynxer LYNXER_CXX=clang++

      - name: Build and self-check Bob (attempt)
        shell: msys2 {0}
        run: make -C Bob test

      - name: Test Lynxer (attempt)
        shell: msys2 {0}
        run: make testLynxer LYNXER_SKIP_DISPLAY=1 LYNXER_CXX=clang++

      - name: Upload the Windows ARM64 binary (if it built)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lynxer-windows-arm64
          path: |
            lynxer/lynxer.exe
            lynxer/lynxer
          if-no-files-found: ignore
