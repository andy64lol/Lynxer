name: Build Clynxer on ARM64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test Clynxer on ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clynxer/rust -> ../build/rust

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ARM64 toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libasound2-dev pkg-config

      - name: Build Clynxer for ARM64
        run: make buildCLynxerArm64

      - name: Test Clynxer ARM64 binary
        run: make testCLynxer CLYNXER_SKIP_DISPLAY=1
      - name: Run the ARM64 syscall fixture
        run: make testCLynxerArm64Syscalls
      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: clynxer-arm64
          path: clynxer/clynxer
