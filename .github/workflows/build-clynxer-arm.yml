name: Build Lynxer (Python) on ARM64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test Lynxer (Python) on ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_venv.txt
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Build Lynxer (Python) Lite for ARM64
        run: make buildLynxerLite

      - name: Build Lynxer (Python) Full for ARM64
        run: make buildLynxer

      - name: Run Lynxer (Python) tests on ARM64
        run: make testLynxer
