name: Build Lynxer on AMD64

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'Bob/**'
      - 'BobI/**'
      - 'lynxer-registry/**'
      - 'supabase/**'
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'todo.md'
      - 'render.yaml'
      - 'netlify.toml'
      - '.github/workflows/build-bob-*.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'Bob/**'
      - 'BobI/**'
      - 'lynxer-registry/**'
      - 'supabase/**'
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'todo.md'
      - 'render.yaml'
      - 'netlify.toml'
      - '.github/workflows/build-bob-*.yml'

jobs:
  build:
    name: Build and Test Lynxer on AMD64
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lynxer/rust -> ../build/rust

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libffi-dev pkg-config \
            xvfb libgl1-mesa-dri mesa-utils

      - name: Build Lynxer for AMD64
        run: make buildLynxer

      - name: Test Lynxer AMD64 binary
        run: make testLynxer LYNXER_SKIP_DISPLAY=1
      - name: Verify virtual OpenGL renderer
        run: |
          renderer="$(xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe glxinfo -B)"
          printf '%s\n' "$renderer"
          grep -qi llvmpipe <<< "$renderer"
      - name: Test windowed graphics and game with software OpenGL
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe make testLynxerGui
      - name: Run the AMD64 syscall fixture
        run: make testLynxerAmd64Syscalls
      - name: Upload AMD64 binary
        uses: actions/upload-artifact@v4
        with:
          name: lynxer-amd64
          path: lynxer/lynxer
