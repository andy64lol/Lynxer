name: Build Lynxer on AMD64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test Lynxer on AMD64
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lynxer/rust -> ../build/rust

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Build Lynxer for AMD64
        run: make buildLynxer

      - name: Test Lynxer AMD64 binary
        run: make testLynxer LYNXER_SKIP_DISPLAY=1
      - name: Run the AMD64 syscall fixture
        run: make testLynxerAmd64Syscalls
      - name: Upload AMD64 binary
        uses: actions/upload-artifact@v4
        with:
          name: lynxer-amd64
          path: lynxer/lynxer
