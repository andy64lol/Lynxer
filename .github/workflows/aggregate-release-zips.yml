name: Aggregate platform release ZIPs

on:
  workflow_run:
    workflows:
      - Build Lynxer on Linux AMD64
      - Build Lynxer on Linux ARM64
      - Build Lynxer on Windows AMD64
      - Build Lynxer on Windows ARM64
      - Build Arch package (AMD64)
      - Build Arch package (ARM64)
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  aggregate:
    name: Bundle all platform ZIPs
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download platform ZIPs and create aggregate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 .github/scripts/aggregate-release-zips.py "$SOURCE_SHA"

      - name: Upload aggregate ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lynxer-all-platforms
          path: dist/lynxer-all-platforms.zip
          if-no-files-found: error
