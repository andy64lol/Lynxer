name: Build Lynxer (Python) on AMD64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test Lynxer (Python) on AMD64
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_venv.txt
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Build Lynxer (Python) Lite for AMD64
        run: make buildClynxerLite

      - name: Build Lynxer (Python) Full for AMD64
        run: make buildClynxer

      - name: Run Lynxer (Python) tests on AMD64
        run: make testClynxer
