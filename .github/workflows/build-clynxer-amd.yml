name: Build Clynxer on AMD64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test Clynxer on AMD64
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clynxer/rust -> ../build/rust

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Build Clynxer for AMD64
        run: make buildCLynxer

      - name: Test Clynxer AMD64 binary
        run: |
          # Command substitution drops the trailing newline the .expected fixtures omit.
          test "$(./clynxer/clynxer clynxer/examples/builtin_ffi.lynx)" = "$(cat clynxer/examples/builtin_ffi.expected)"
          test "$(./clynxer/clynxer clynxer/examples/builtin_async.lynx)" = "$(cat clynxer/examples/builtin_async.expected)"
      - name: Upload AMD64 binary
        uses: actions/upload-artifact@v4
        with:
          name: clynxer-amd64
          path: clynxer/clynxer
