name: Build Arch package (AMD64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID of Build Lynxer on Linux AMD64 (blank = find by commit)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build x86_64 Arch package
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # The package wraps this exact binary; it never compiles Lynxer again.
      - name: Download the compiled AMD64 Lynxer binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/download-build-artifact.py \
            --workflow build-lynxer-linux-amd64.yml \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --artifact lynxer-linux-amd64 \
            --out "$GITHUB_WORKSPACE/dist/payload/x86_64" \
            --run-id "${{ github.event.inputs.build_run_id }}"

      - name: Wrap the binary in an Arch package
        run: |
          docker run --rm \
            -e LYNXER_EXPECTED_ARCH=x86_64 \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            archlinux:latest \
            /bin/bash /src/.github/scripts/build-arch-package.sh

      - name: Fix package output ownership
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Zip the package
        run: python3 .github/scripts/zip-arch-package.py x86_64

      - name: Check packaged Lynxer version
        run: |
          payload="dist/payload/x86_64"
          if [ -f "$payload/lynxer/lynxer.config" ]; then payload="$payload/lynxer"; fi
          version="$("$payload/lynxer" --version)"
          expected="Lynxer $(sed -n 's/^version *= *//p' lynxer/lynxer.config | head -n1)"
          echo "Packaged Lynxer version: $version (checkout: $expected)"
          if [ "$version" != "$expected" ]; then
            echo "Packaged version does not match the checkout; aborting."
            exit 1
          fi
          if [ "$version" = "Lynxer 0.1.9b1" ]; then
            echo "Forbidden Lynxer version detected; aborting."
            exit 1
          fi

      - name: Upload x86_64 Arch package ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lynxer-arch-x86_64
          path: dist/lynxer-*-x86_64.zip
          if-no-files-found: error
