name: Build Arch package (AMD64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64 Arch package
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Build package in Arch Linux
        run: |
          docker run --rm \
            -e LYNXER_EXPECTED_ARCH=x86_64 \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            archlinux:latest \
            /bin/bash /src/.github/scripts/build-arch-package.sh

      - name: Zip the package
        run: python3 .github/scripts/zip-arch-package.py x86_64

      - name: Upload x86_64 Arch package ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lynxer-arch-x86_64
          path: dist/lynxer-*-x86_64.zip
          if-no-files-found: error
