name: Build Clynxer

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show the C++ toolchain
        run: c++ --version

      - name: Build the interpreter and the native stdlib modules
        run: make buildCLynxer

      - name: Check that the native modules were produced
        run: |
          echo "Built modules:"
          ls -1 clynxer/stdlib/*.so
          test -f clynxer/stdlib/math.so
          test -f clynxer/stdlib/json.so
          test -f clynxer/stdlib/path.so

      - name: List the available stdlib modules
        run: ./clynxer/clynxer --list-stdlibs

      - name: Run the Clynxer test suite
        run: make testCLynxer

      - name: Compile a program to a standalone executable and run it
        run: |
          ./clynxer/clynxer --compile clynxer/examples/milestone5.lynx -o /tmp/clynxer-smoke
          output="$(/tmp/clynxer-smoke)"
          expected="$(printf '5\n7\n25')"
          if [ "$output" != "$expected" ]; then
            echo "expected: $expected"
            echo "received: $output"
            exit 1
          fi
          echo "compiled executable output OK"

      - name: Compile several input files into one executable and run it
        run: |
          # bundle_app.lynx imports modules that only exist as extra inputs, so
          # this only works if all three files land in the same executable.
          ./clynxer/clynxer --compile \
            clynxer/examples/bundle_app.lynx \
            clynxer/examples/bundle_extras/greeter.lynx \
            clynxer/examples/bundle_extras/counter.lynx \
            -o /tmp/clynxer-multi
          output="$(cd / && /tmp/clynxer-multi)"
          expected="$(printf 'hello, LYNXER!\n1,2,3')"
          if [ "$output" != "$expected" ]; then
            echo "expected: $expected"
            echo "received: $output"
            exit 1
          fi
          echo "multi-file executable output OK"

      - name: Include a data file and read it from the executable
        run: |
          printf 'bundled payload\n' > /tmp/message.txt
          ./clynxer/clynxer --compile clynxer/examples/bundle_assets.lynx \
            --include /tmp/message.txt -o /tmp/clynxer-assets
          output="$(cd / && /tmp/clynxer-assets)"
          expected="$(printf '[message.txt]\nbundled payload')"
          if [ "$output" != "$expected" ]; then
            echo "expected: $expected"
            echo "received: $output"
            exit 1
          fi
          echo "included data file output OK"

      - name: Compile a program that imports stdlib modules
        run: |
          cat > /tmp/import-smoke.lynx <<'LYNX'
          global setup(){
              import("math");
              import("json");
          }

          global main(){
              println(global.math.max(2, 5));
              println(global.json.jsonGet("{\"a\": 1}", "a"));
          }
          LYNX
          ./clynxer/clynxer --compile /tmp/import-smoke.lynx -o /tmp/clynxer-import-smoke
          output="$(/tmp/clynxer-import-smoke)"
          expected="$(printf '5\n1')"
          if [ "$output" != "$expected" ]; then
            echo "expected: $expected"
            echo "received: $output"
            exit 1
          fi
          echo "import-using executable output OK"
