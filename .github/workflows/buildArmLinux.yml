name: Build linux arm64

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Test ARM64
        run: make testAMR64

  buildLite:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build Lite
        run: make buildLite
