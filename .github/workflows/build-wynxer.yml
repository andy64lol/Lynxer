name: Wynxer combined smoke test (manual)

# Legacy combined Linux + Windows check. The canonical CI is the four
# per-platform workflows (build-wynxer-linux-amd64.yml, ...-arm64.yml,
# ...-windows-amd64.yml, ...-windows-arm64.yml); this one is kept for a quick
# manual cross-platform sanity run and does not fire on push/PR.

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build and test Wynxer on Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wynxer
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wynxer -> target
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test
      - name: Version check
        run: ./target/release/wynxer --version

  build-windows:
    name: Build and test Wynxer on Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wynxer
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wynxer -> target
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test
      - name: Version check
        run: ./target/release/wynxer.exe --version
