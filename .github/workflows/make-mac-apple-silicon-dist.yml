name: macOS Apple Silicon build

on:
  push:
  pull_request:

jobs:
  build-macos-arm64:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Verify architecture
        run: |
          echo "Architecture:"
          uname -m
          echo "Python architecture:"
          ./venv/bin/python -c "import platform; print(platform.machine())" 2>/dev/null || true

      - name: Create virtual environment
        run: python -m venv venv

      - name: Install dependencies
        run: |
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/python -m pip install --upgrade -r requirements_venv.txt
          ./venv/bin/python -m pip install --upgrade pyinstaller

      - name: Patch Arcade PyInstaller hook
        run: |
          hook=$(./venv/bin/python -c "import arcade, os; print(os.path.join(os.path.dirname(arcade.__file__), '__pyinstaller', 'hook-arcade.py'))")

          if [ -f "$hook" ]; then
            sed -i '' 's|"./arcade/VERSION"|"./arcade"|g' "$hook"
          fi

      - name: Build Lynxer
        run: |
          collectArgs=()

          while IFS= read -r line; do
            line=$(echo "$line" | sed 's/#.*//' | xargs)

            if [ -n "$line" ]; then
              package=$(echo "$line" | sed 's/[<>=!~].*//' | sed 's/\[.*\]//')

              if [ -n "$package" ]; then
                collectArgs+=("--collect-all=$package")
              fi
            fi
          done < requirements_venv.txt

          ./venv/bin/pyinstaller \
            --onefile \
            --clean \
            "${collectArgs[@]}" \
            --name lynxer \
            --add-data "lynxer/warnings.txt:lynxer" \
            --add-data "lynxer/stdlib:stdlib" \
            lynxer/shell.py

      - name: Install Lite dependencies
        run: |
          ./venv/bin/python -m pip install --upgrade pyinstaller cython setuptools

      - name: Select pure stdlib
        run: |
          rm -rf build/stdlib_pure

          ./venv/bin/python \
            scripts/select_pure_stdlib.py \
            lynxer/stdlib \
            build/stdlib_pure

      - name: Build Lynxer Lite
        run: |
          ./venv/bin/pyinstaller \
            --onefile \
            --clean \
            --collect-all=Cython \
            --collect-all=setuptools \
            --hidden-import=Cython.Build.Inline \
            --name lynxer-lite \
            --add-data "lynxer/warnings.txt:lynxer" \
            --add-data "build/stdlib_pure:stdlib" \
            lynxer/shell.py

      - name: Verify architecture
        run: |
          file dist/lynxer
          file dist/lynxer-lite

      - name: Upload macOS ARM64 builds
        uses: actions/upload-artifact@v4
        with:
          name: lynxer-macos-arm64
          path: |
            dist/lynxer
            dist/lynxer-lite
