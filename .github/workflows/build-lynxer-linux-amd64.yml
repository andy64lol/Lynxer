name: Build Lynxer on Linux AMD64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test Lynxer on Linux AMD64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lynxer/rust -> ../build/rust

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libasound2-dev libffi-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev

      - name: Build Lynxer
        run: make buildLynxer

      - name: Test Lynxer
        run: make testLynxer LYNXER_SKIP_DISPLAY=1

      - name: Upload AMD64 binary
        uses: actions/upload-artifact@v4
        with:
          name: lynxer-linux-amd64
          path: |
            lynxer/lynxer
            lynxer/stdlib
            lynxer/lynxer.config
            lynxer/liblynxer.so
            lynxer/lynxer.h
            lynxer/ffi_abi.h

  publish:
    name: Publish Lynxer Arch Package
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build Arch package using Arch Linux container
        run: |
          docker run --rm -v "$(pwd)":/src -w /src/packaging/aur/lynxer archlinux:latest \
            bash -c "
              pacman -Syu --noconfirm --needed base-devel git rust pkgconf libffi alsa-lib bzip2 && \
              useradd -m builder && \
              chown -R builder:builder /src/packaging/aur/lynxer && \
              su builder -c 'makepkg --noconfirm' && \
              ls -la *.pkg.tar.zst
            "

      - name: Download the built package
        run: |
          PACKAGE_FILE=$(basename packaging/aur/lynxer/lynxer-*.pkg.tar.zst)
          echo "PACKAGE_FILE=$PACKAGE_FILE" >> $GITHUB_ENV

      - name: Validate package
        run: |
          PACKAGE_PATH="packaging/aur/lynxer/${{ env.PACKAGE_FILE }}"
          if [ ! -f "$PACKAGE_PATH" ]; then
            echo "Error: Package file not found!"
            exit 1
          fi
          echo "Package file: $PACKAGE_PATH"
          # Verify package metadata (simplified check)
          file "$PACKAGE_PATH" | grep -q "XZ compressed data" || {
            echo "Error: Invalid package format!"
            exit 1;
          }

      - name: Checkout andy-repo
        uses: actions/checkout@v4
        with:
          repository: andy64lol/andy-repo
          token: ${{ secrets.ANDY_REPO_TOKEN }}
          path: andy-repo

      - name: Update andy-repo with the new package
        run: |
          cd andy-repo
          cp "../packaging/aur/lynxer/${{ env.PACKAGE_FILE }}" .
          repo-add lynxer.db "${{ env.PACKAGE_FILE }}"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add lynxer.db ${{ env.PACKAGE_FILE }}
          git commit -m "Update Lynxer package to ${{ env.PACKAGE_FILE }}"
          git push
