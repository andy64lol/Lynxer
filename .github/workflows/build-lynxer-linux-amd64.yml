name: Build Lynxer on Linux AMD64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test Lynxer on Linux AMD64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lynxer/rust -> ../build/rust

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev pkg-config libasound2-dev libffi-dev libgl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxinerama-dev libxcursor-dev libxxf86vm-dev

      - name: Build Lynxer
        run: make buildLynxer

      - name: Test Lynxer
        run: make testLynxer LYNXER_SKIP_DISPLAY=1

      - name: Upload AMD64 binary
        uses: actions/upload-artifact@v4
        with:
          name: lynxer-linux-amd64
          path: |
            lynxer/lynxer
            lynxer/stdlib
            lynxer/lynxer.config
            lynxer/liblynxer.so
            lynxer/lynxer.h
            lynxer/ffi_abi.h
