name: Build Lynxer on Linux AMD64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test Lynxer on Linux AMD64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lynxer/rust -> ../build/rust

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev pkg-config libasound2-dev libffi-dev libgl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxinerama-dev libxcursor-dev libxxf86vm-dev

      - name: Build Lynxer
        run: make buildLynxer

      - name: Test Lynxer
        run: make testLynxer LYNXER_SKIP_DISPLAY=1

      - name: Upload AMD64 binary
        uses: actions/upload-artifact@v4
        with:
          name: lynxer-linux-amd64
          path: |
            lynxer/lynxer
            lynxer/stdlib
            lynxer/lynxer.config
            lynxer/liblynxer.so
            lynxer/lynxer.h
            lynxer/ffi_abi.h

  publish:
    name: Publish Lynxer Arch Package
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build Arch package using Arch Linux container
        run: |
          docker run --rm -v "$(pwd)":/src -w /src/packaging/aur/lynxer archlinux:latest \
            bash /src/.github/scripts/build-arch-package.sh

      - name: Locate the built package
        run: |
          PACKAGE_FILE=$(basename packaging/aur/lynxer/lynxer-*.pkg.tar.zst)
          echo "PACKAGE_FILE=$PACKAGE_FILE" >> $GITHUB_ENV

      - name: Validate package
        run: |
          PACKAGE_PATH="packaging/aur/lynxer/${{ env.PACKAGE_FILE }}"
          if [ ! -f "$PACKAGE_PATH" ]; then
            echo "Error: Package file not found!"
            exit 1
          fi
          echo "Package file: $PACKAGE_PATH"
          # Verify package metadata (simplified check)
          file "$PACKAGE_PATH" | grep -qi "Zstandard compressed data" || {
            echo "Error: Invalid package format!"
            exit 1;
          }

      - name: Authenticate and checkout andy-repo
        env:
          ANDY_REPO_TOKEN: ${{ secrets.ANDY_REPO_TOKEN }}
        run: node .github/scripts/checkout-andy-repo.mjs

      - name: Update andy-repo with the new package
        env:
          ANDY_REPO_TOKEN: ${{ secrets.ANDY_REPO_TOKEN }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_ASKPASS: ${{ github.workspace }}/.github/scripts/git-askpass.sh
          GIT_TERMINAL_PROMPT: '0'
        run: |
          cp "packaging/aur/lynxer/${{ env.PACKAGE_FILE }}" andy-repo/
          docker run --rm \
            -e PACKAGE_FILE="${{ env.PACKAGE_FILE }}" \
            -v "$(pwd)":/src -w /src/andy-repo archlinux:latest \
            bash -ec 'repo-add lynxer.db.tar.gz "$PACKAGE_FILE"'
          cd andy-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add lynxer.db lynxer.db.tar.gz lynxer.files lynxer.files.tar.gz "${{ env.PACKAGE_FILE }}"
          if git diff --cached --quiet; then
            echo "Package repository is already up to date."
            exit 0
          fi
          git commit -m "Update Lynxer package to ${{ env.PACKAGE_FILE }}"
          git -c credential.helper= push
