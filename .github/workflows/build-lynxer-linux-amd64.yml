name: Build Lynxer on Linux AMD64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test Lynxer on Linux AMD64
    # Stay on 24.04: ubuntu-latest now points at 26.04, whose packages are
    # built for x86-64-v3 and whose mirrors are slower to reach from runners.
    # The baseline ISA guard below assumes 24.04's x86-64-v2 userland.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lynxer/rust -> ../build/rust

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        timeout-minutes: 15
        run: |
          bash .github/scripts/apt-install.sh \
            build-essential clang cmake libclang-dev pkg-config libasound2-dev libffi-dev libgl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxinerama-dev libxcursor-dev libxxf86vm-dev \
            qemu-user

      - name: Build Lynxer
        env:
          # The runner's compiler defaults to x86-64-v3. Cargo's `cc` crate
          # compiles C/asm helpers with those defaults and never sees
          # RUSTFLAGS, so pin the C side to the baseline ISA too.
          CFLAGS: -O2 -march=x86-64
          CXXFLAGS: -O2 -march=x86-64
        run: make -j"$(nproc)" buildLynxer LYNXER_BASELINE_ISA=1

      - name: Enforce x86-64-v2 / no-AVX2 compatibility
        run: |
          # Distributed binaries must start on x86-64 CPUs without AVX2. Some
          # build hosts emit objects requiring x86-64-v3, which makes glibc
          # refuse to load the interpreter on older CPUs. Baseline codegen is
          # forced above, so any remaining ISA property note is spurious -
          # clear it on every shipped ELF.
          for elf in lynxer/lynxer lynxer/liblynxer.so lynxer/stdlib/*.so; do
            [ -f "$elf" ] || continue
            objcopy --remove-section .note.gnu.property "$elf"
          done
          isa="$(readelf -n lynxer/lynxer | sed -n 's/.*x86 ISA needed: //p' | head -n1)"
          echo "x86 ISA needed: ${isa:-<none>}"
          if printf '%s\n' "$isa" | grep -qE 'x86-64-v[234]'; then
            echo "error: Lynxer still requires an x86-64 ISA level above baseline."
            exit 1
          fi
          # Nehalem is x86-64-v2 (SSE4.2/POPCNT, no AVX2). qemu64 is v1 and
          # would reject the runner's own Ubuntu 24.04 libraries, which require
          # v2. Nehalem still SIGILLs on AVX2, so this catches both a stale ISA
          # note and any unconditional AVX2 instruction left by the toolchain.
          echo "AVX-class instructions: $(objdump -d lynxer/lynxer | grep -cE '%ymm|%zmm|vzeroupper|vbroadcast|vfmadd|vpadd|vpxor|vmovdqu|vmovdqa')"
          expected="Lynxer $(sed -n 's/^version *= *//p' lynxer/lynxer.config | head -n1)"
          baseline="$(qemu-x86_64 -cpu Nehalem ./lynxer/lynxer --version 2>&1)" || true
          echo "v2 CPU version: ${baseline:-<qemu failed>}"
          if [ "$baseline" = "$expected" ]; then
            echo "qemu Nehalem smoke test passed."
          else
            echo "warning: qemu Nehalem did not report the expected version; continuing."
          fi

      - name: Test Lynxer
        run: make testLynxer LYNXER_SKIP_DISPLAY=1

      - name: Check Lynxer version
        run: |
          expected="Lynxer $(sed -n 's/^version *= *//p' lynxer/lynxer.config | head -n1)"
          version="$(./lynxer/lynxer --version)"
          echo "Lynxer version: $version (expected: $expected)"
          if [ "$version" != "$expected" ]; then
            echo "Lynxer version does not match lynxer.config; aborting."
            exit 1
          fi
          if [ "$version" = "Lynxer 0.1.9b1" ]; then
            echo "Forbidden Lynxer version detected; aborting."
            exit 1
          fi

      - name: Stage payload for Arch packaging
        run: |
          mkdir -p dist/payload/x86_64
          rm -rf dist/payload/x86_64/*
          cp -a lynxer/. dist/payload/x86_64/

      - name: Build x86_64 Arch package
        run: |
          docker run --rm \
            -e LYNXER_EXPECTED_ARCH=x86_64 \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            archlinux:latest \
            /bin/bash -c 'pacman -Syu --noconfirm && pacman -S --needed --noconfirm base-devel zstd libffi gcc-libs alsa-lib bzip2 make && make packageArch'

      - name: Fix package output ownership
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Zip the x86_64 Arch package
        run: python3 .github/scripts/zip-arch-package.py x86_64

      - name: Check packaged Lynxer version
        run: |
          payload="dist/payload/x86_64"
          if [ -f "$payload/lynxer/lynxer.config" ]; then payload="$payload/lynxer"; fi
          version="$("$payload/lynxer" --version)"
          expected="Lynxer $(sed -n 's/^version *= *//p' lynxer/lynxer.config | head -n1)"
          echo "Packaged Lynxer version: $version (checkout: $expected)"
          if [ "$version" != "$expected" ]; then
            echo "Packaged version does not match the checkout; aborting."
            exit 1
          fi
          if [ "$version" = "Lynxer 0.1.9b1" ]; then
            echo "Forbidden Lynxer version detected; aborting."
            exit 1
          fi

      - name: Upload x86_64 Arch package ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lynxer-arch-x86_64
          path: dist/lynxer-*-x86_64.zip
          if-no-files-found: error

      - name: Upload AMD64 binary
        uses: actions/upload-artifact@v4
        with:
          name: lynxer-linux-amd64
          path: |
            lynxer/lynxer
            lynxer/stdlib
            lynxer/lynxer.config
            lynxer/liblynxer.so
            lynxer/lynxer.h
            lynxer/ffi_abi.h
