name: Build Lynxer on Linux AMD64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test Lynxer on Linux AMD64
    runs-on: ubuntu-latest
    timeout-minutes: 60

  publish:
    name: Publish Lynxer Arch Package
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build Arch package using Arch Linux container
        run: |
          docker run --rm -v "$(pwd)":/src -w /src archlinux:latest \
            bash -c "
              pacman -Syu --noconfirm --needed base-devel git rust pkgconf libffi alsa-lib bzip2 && \
              cd packaging/aur/lynxer && \
              makepkg --noconfirm --nobuild && \
              ls -la *.pkg.tar.zst
            "

      - name: Download the built package
        run: |
          PACKAGE_FILE=$(ls lynxer-*.pkg.tar.zst)
          echo "PACKAGE_FILE=$PACKAGE_FILE" >> $GITHUB_ENV

      - name: Validate package
        run: |
          if [ ! -f "${{ env.PACKAGE_FILE }}" ]; then
            echo "Error: Package file not found!"
            exit 1
          fi
          echo "Package file: ${{ env.PACKAGE_FILE }}"
          # Verify package metadata (simplified check)
          file "${{ env.PACKAGE_FILE }}" | grep -q "XZ compressed data" || {
            echo "Error: Invalid package format!"
            exit 1;
          }

      - name: Checkout andy-repo
        uses: actions/checkout@v4
        with:
          repository: andy64lol/andy-repo
          token: ${{ secrets.ANDY_REPO_TOKEN }}
          path: andy-repo

      - name: Update andy-repo with the new package
        run: |
          cd andy-repo
          repo-add lynxer.db ${{ env.PACKAGE_FILE }}
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add lynxer.db ${{ env.PACKAGE_FILE }}
          git commit -m "Update Lynxer package to ${{ env.PACKAGE_FILE }}"
          git push
