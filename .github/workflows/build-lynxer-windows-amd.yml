name: Build Lynxer on Windows AMD64 (experimental)

# The Windows port is in progress (see docs/windows.md). This job attempts a
# real build and test on windows-latest so progress and breakage stay visible,
# and it is allowed to fail while the port is incomplete. Remove the
# `continue-on-error` on the job once it is green.
#
# It builds inside MSYS2 MINGW64 so the C++ compiler, `make` and the Rust
# toolchain all share the same GNU ABI (a staticlib linked into the
# interpreter has to match the compiler).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Attempt build and test on Windows AMD64
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (MINGW64) with gcc, make, libffi and Rust
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lynxer/rust -> ../build/rust

      - name: Show the toolchain
        shell: msys2 {0}
        run: |
          uname -a
          g++ --version | head -1
          make --version | head -1
          cargo --version
          pkg-config --modversion libffi || true

      - name: Build Lynxer (attempt)
        shell: msys2 {0}
        run: make buildLynxer

      - name: Build and self-check Bob (attempt)
        shell: msys2 {0}
        run: make -C Bob test

      - name: Test Lynxer (attempt)
        shell: msys2 {0}
        run: make testLynxer LYNXER_SKIP_DISPLAY=1

      - name: Upload the Windows AMD64 binary (if it built)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lynxer-windows-amd64
          path: |
            lynxer/lynxer.exe
            lynxer/lynxer
          if-no-files-found: ignore
