name: Build Bob on Linux ARM64

# Bob is the Lynxer package manager, a separate Rust component (see
# Bob/README.md). It has its own workflows and is no longer built by the Lynxer
# ones; like the rest of CI they run on every push and pull request to main.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and self-check Bob on Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Bob -> target

      - name: Build and self-check Bob
        run: make -C Bob test

      - name: Upload the Bob binary
        uses: actions/upload-artifact@v4
        with:
          name: bob-linux-arm64
          path: Bob/target/release/bob
          if-no-files-found: error
