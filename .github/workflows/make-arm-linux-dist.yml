name: Linux ARM64 Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Create virtual environment
        shell: bash
        run: |
          if [ ! -d "venv" ]; then
            echo "Creating virtual environment 'venv'..."
            python -m venv venv
          else
            echo "Using existing virtual environment 'venv'."
          fi

      - name: Install dependencies
        shell: bash
        run: |
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/python -m pip install --upgrade -r requirements_venv.txt

      - name: Patch Arcade PyInstaller hook
        shell: bash
        run: |
          hook=$(./venv/bin/python -c "import arcade, os; print(os.path.join(os.path.dirname(arcade.__file__), '__pyinstaller', 'hook-arcade.py'))")

          if [ -f "$hook" ]; then
            sed -i 's|"./arcade/VERSION"|"./arcade"|g' "$hook"
            echo "  -> Patched $hook"
          else
            echo "  -> Hook file not found (Arcade may not be installed?)"
          fi

      - name: Install PyInstaller
        shell: bash
        run: |
          ./venv/bin/python -m pip install --upgrade pyinstaller

      - name: Build Lynxer
        shell: bash
        run: |
          collectArgs=()

          while IFS= read -r line; do
            line=$(echo "$line" | sed 's/#.*//' | xargs)

            if [ -n "$line" ]; then
              package=$(echo "$line" | sed 's/[<>=!~].*//' | sed 's/\[.*\]//')

              if [ -n "$package" ]; then
                collectArgs+=("--collect-all=$package")
              fi
            fi
          done < requirements_venv.txt

          ./venv/bin/pyinstaller \
            --onefile \
            --clean \
            "${collectArgs[@]}" \
            --name lynxer \
            --add-data "lynxer/warnings.txt:lynxer" \
            --add-data "lynxer/stdlib:stdlib" \
            lynxer/shell.py

          echo "✓ Build complete: dist/lynxer"

      - name: Install Lite dependencies
        shell: bash
        run: |
          ./venv/bin/python -m pip install --upgrade pyinstaller cython setuptools

      - name: Select pure stdlib
        shell: bash
        run: |
          rm -rf build/stdlib_pure

          ./venv/bin/python \
            scripts/select_pure_stdlib.py \
            lynxer/stdlib \
            build/stdlib_pure

      - name: Build Lynxer Lite
        shell: bash
        run: |
          ./venv/bin/pyinstaller \
            --onefile \
            --clean \
            --collect-all=Cython \
            --collect-all=setuptools \
            --hidden-import=Cython.Build.Inline \
            --name lynxer-lite \
            --add-data "lynxer/warnings.txt:lynxer" \
            --add-data "build/stdlib_pure:stdlib" \
            lynxer/shell.py

          echo "✓ Lite build complete: dist/lynxer-lite"

      - name: Verify architecture
        shell: bash
        run: |
          file dist/lynxer
          file dist/lynxer-lite

      - name: Upload Linux ARM64 builds
        uses: actions/upload-artifact@v4
        with:
          name: lynxer-linux-arm64
          path: |
            dist/lynxer
            dist/lynxer-lite
