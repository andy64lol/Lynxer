name: Build Lynxer on Windows ARM64

# Builds and tests Lynxer on an ARM64 Windows runner (see docs/windows.md). This
# is a required job: the port's excluded surface (named syscalls, `sys`, and
# POSIX-only managed APIs) is skipped explicitly rather than
# allowed to fail.
#
# It builds inside MSYS2 CLANGARM64, the ARM64 environment where the C++
# compiler is clang, so the C++ build, `make` and the Rust toolchain share the
# same ABI.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and test on Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (CLANGARM64) with clang, make, libffi, Rust, and CMake
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            make
            coreutils
            diffutils
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-libffi
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-python
            mingw-w64-clang-aarch64-rust
            mingw-w64-clang-aarch64-cmake

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lynxer/rust -> ../build/rust

      - name: Show the toolchain
        shell: msys2 {0}
        run: |
          uname -a
          clang++ --version | head -1
          make --version | head -1
          cargo --version
          pkg-config --modversion libffi || true

      - name: Build Lynxer
        shell: msys2 {0}
        run: make buildLynxer LYNXER_CXX=clang++

      - name: Test Lynxer
        shell: msys2 {0}
        run: make testLynxer LYNXER_SKIP_DISPLAY=1 LYNXER_CXX=clang++

      - name: Test shared-library embedding
        shell: msys2 {0}
        run: |
          set -e
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cxx="$(command -v clang++ || command -v g++)"
          cp lynxer/examples/export_basic.lynx "$work/"
          ./lynxer/lynxer.exe --emit-library "$work/export_basic.lynx" \
            --cc "$cxx" -o "$work/libexport_basic.dll"
          cp lynxer/lynxer.dll lynxer/lynxer.h lynxer/ffi_abi.h "$work/"
          "$cxx" -std=c++17 -I"$work" lynxer/examples/export_test.cpp \
            "$work/libexport_basic.dll.a" -o "$work/export_test.exe"
          (cd "$work" && ./export_test.exe)

      - name: Collect runtime DLLs
        shell: msys2 {0}
        run: |
          mkdir -p lynxer/runtime
          ldd lynxer/lynxer.exe | awk '/=> \// {print $3}' | while IFS= read -r dll; do
            case "$dll" in
              /mingw64/*|/clangarm64/*) cp "$dll" lynxer/runtime/; cp "$dll" lynxer/ ;;
            esac
          done

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: msys2 {0}
        run: |
          ./packaging/windows/stage-payload.sh
          MSYS2_ARG_CONV_EXCL="/D" "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            /DMyArch=arm64 packaging/windows/lynxer.iss

      - name: Bundle the installer and portable program
        shell: msys2 {0}
        run: |
          python packaging/windows/make-release-zip.py \
            --arch arm64 \
            --installer dist/lynxer-*-windows-arm64-setup.exe \
            --output dist/lynxer-windows-arm64.zip

      - name: Check Lynxer version
        shell: msys2 {0}
        run: |
          version="$(./lynxer/lynxer.exe --version)"
          echo "Lynxer version: $version"
          if [ "$version" = "Lynxer 0.1.9b1" ]; then
            echo "Forbidden Lynxer version detected; aborting."
            exit 1
          fi

      - name: Upload the Windows ARM64 release zip
        uses: actions/upload-artifact@v4
        with:
          name: lynxer-windows-arm64
          path: dist/lynxer-windows-arm64.zip
          if-no-files-found: error

  native-module-msvc:
    name: Build a native module with MSVC (ARM64)
    runs-on: windows-11-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Build and check the exported entry point
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /std:c++17 /EHsc /LD /Ilynxer\stdlib ^
            lynxer\examples\native_signatures.cpp ^
            /Fe:build\native_signatures.dll
          dumpbin /exports build\native_signatures.dll | findstr /C:"lynxer_module_init_v1"
          dumpbin /exports build\native_signatures.dll | findstr /C:"sig_ii"
