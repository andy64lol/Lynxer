name: Build Lynxer on Windows AMD64

# Builds and tests Lynxer on windows-latest (see docs/windows.md). This is a
# required job: the port's excluded surface (named syscalls, `sys`, and
# POSIX-only managed APIs) is skipped explicitly rather than
# allowed to fail.
#
# It builds inside MSYS2 MINGW64 so the C++ compiler, `make` and the Rust
# toolchain all share the same GNU ABI (a staticlib linked into the
# interpreter has to match the compiler).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and test on Windows AMD64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (MINGW64) with gcc, make, libffi, Rust, and CMake
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            coreutils
            diffutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-cmake

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lynxer/rust -> ../build/rust

      - name: Show the toolchain
        shell: msys2 {0}
        run: |
          uname -a
          g++ --version | head -1
          make --version | head -1
          cargo --version
          pkg-config --modversion libffi || true

      - name: Configure bindgen C headers
        shell: msys2 {0}
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include)" >> "$GITHUB_ENV"

      - name: Build Lynxer
        shell: msys2 {0}
        run: make buildLynxer

      - name: Test Lynxer
        shell: msys2 {0}
        run: make testLynxer LYNXER_SKIP_DISPLAY=1

      - name: Test shared-library embedding
        shell: msys2 {0}
        run: |
          set -e
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cxx="$(command -v g++ || command -v clang++)"
          cp lynxer/examples/export_basic.lynx "$work/"
          ./lynxer/lynxer.exe --emit-library "$work/export_basic.lynx" \
            --cc "$cxx" -o "$work/libexport_basic.dll"
          cp lynxer/lynxer.dll lynxer/lynxer.h lynxer/ffi_abi.h "$work/"
          "$cxx" -std=c++17 -I"$work" lynxer/examples/export_test.cpp \
            "$work/libexport_basic.dll.a" -o "$work/export_test.exe"
          (cd "$work" && ./export_test.exe)

      - name: Collect runtime DLLs
        shell: msys2 {0}
        run: |
          mkdir -p lynxer/runtime
          ldd lynxer/lynxer.exe | awk '/=> \// {print $3}' | while IFS= read -r dll; do
            case "$dll" in
              /mingw64/*|/clangarm64/*) cp "$dll" lynxer/runtime/; cp "$dll" lynxer/ ;;
            esac
          done

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: msys2 {0}
        run: |
          ./packaging/windows/stage-payload.sh
          MSYS2_ARG_CONV_EXCL="/D" "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            /DMyArch=amd64 packaging/windows/lynxer.iss

      - name: Bundle the installer and portable program
        shell: msys2 {0}
        run: |
          python packaging/windows/make-release-zip.py \
            --arch amd64 \
            --installer dist/lynxer-*-windows-amd64-setup.exe \
            --output dist/lynxer-windows-amd64.zip

      - name: Upload the Windows AMD64 release zip
        uses: actions/upload-artifact@v4
        with:
          name: lynxer-windows-amd64
          path: dist/lynxer-windows-amd64.zip
          if-no-files-found: error

  native-module-msvc:
    name: Build a native module with MSVC
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and check the exported entry point
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /std:c++17 /EHsc /LD /Ilynxer\stdlib ^
            lynxer\examples\native_signatures.cpp ^
            /Fe:build\native_signatures.dll
          dumpbin /exports build\native_signatures.dll | findstr /C:"lynxer_module_init_v1"
          dumpbin /exports build\native_signatures.dll | findstr /C:"sig_ii"
