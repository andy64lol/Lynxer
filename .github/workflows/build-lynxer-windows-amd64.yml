name: Build Lynxer on Windows AMD64

# Builds and tests Lynxer on windows-latest (see docs/windows.md). This is a
# required job: the port's excluded surface (named syscalls, `sys`, the POSIX
# stdlib modules, the embedding runtime) is skipped explicitly rather than
# allowed to fail.
#
# It builds inside MSYS2 MINGW64 so the C++ compiler, `make` and the Rust
# toolchain all share the same GNU ABI (a staticlib linked into the
# interpreter has to match the compiler).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and test on Windows AMD64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (MINGW64) with gcc, make, libffi, Rust, and CMake
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            coreutils
            diffutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-cmake

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lynxer/rust -> ../build/rust

      - name: Show the toolchain
        shell: msys2 {0}
        run: |
          uname -a
          g++ --version | head -1
          make --version | head -1
          cargo --version
          pkg-config --modversion libffi || true

      - name: Build Lynxer
        shell: msys2 {0}
        run: make buildLynxer

      - name: Test Lynxer
        shell: msys2 {0}
        run: make testLynxer LYNXER_SKIP_DISPLAY=1

      - name: Upload the Windows AMD64 binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lynxer-windows-amd64
          path: |
            lynxer/lynxer.exe
            lynxer/lynxer
            lynxer/stdlib
            lynxer/lynxer.config
          if-no-files-found: ignore
