[package]
name = "lynxer_sqldb"
version = "0.1.0"
edition = "2021"
description = "Rust backend for the Lynxer `sqldb` stdlib module"

[lib]
name = "lynxer_sqldb"
crate-type = ["cdylib"]

[dependencies]
lynxer_abi = { path = "../abi" }
# `bundled` compiles SQLite from source, so the module has no system
# sqlite3 dependency (the Windows toolchain ships none).
rusqlite = { version = "0.29", features = ["blob", "bundled"] }
serde_json = "1"
base64 = "0.21"