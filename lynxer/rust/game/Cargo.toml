[package]
name = "clynxer_game"
version = "0.1.0"
edition = "2021"
description = "macroquad backend for the Clynxer `game` stdlib module"
publish = false

[lib]
name = "clynxer_game"
# A cdylib that exports lynxer_module_init_v1 and its ops directly, like the
# json/network/server modules: no C++ shim and no --whole-archive linking.
crate-type = ["cdylib"]

[dependencies]
clynxer_abi = { path = "../abi" }
macroquad = "0.4"

# The release profile lives in the workspace root (clynxer/rust/Cargo.toml).
