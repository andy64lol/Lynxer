[package]
name = "lynxer_xml"
version = "0.1.0"
edition = "2021"
description = "XML parsing and serialization for the Lynxer `xml` stdlib module"
publish = false

[lib]
name = "lynxer_xml"
crate-type = ["cdylib"]

[dependencies]
lynxer_abi = { path = "../abi" }
# Streaming XML; documents cross as JSON element trees.
quick-xml = "0.42"
serde_json = "1"
