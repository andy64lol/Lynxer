[package]
name = "lynxer_lua"
version = "0.1.0"
edition = "2021"
description = "mlua backend for the Lynxer `lua` stdlib module"
publish = false

[lib]
name = "lynxer_lua"
crate-type = ["cdylib"]

[dependencies]
lynxer_abi = { path = "../abi" }
# `vendored` compiles Lua 5.4 from source, so no system Lua is required.
mlua = { version = "0.12", features = ["lua54", "vendored"] }
