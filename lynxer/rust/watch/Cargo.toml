[package]
name = "lynxer_watch"
version = "0.1.0"
edition = "2021"
description = "Filesystem change events for the Lynxer `watch` stdlib module"
publish = false

[lib]
name = "lynxer_watch"
crate-type = ["cdylib"]

[dependencies]
lynxer_abi = { path = "../abi" }
# Raw syscalls for the Linux (inotify) and macOS/BSD (kqueue) backends: the
# non-blocking flag on the watch descriptor and the kevent calls themselves.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The inotify backend directly, not `notify`: the design exposes the watch
# descriptor (watchFd) for the interpreter's poll set, which `notify` does not.
# It is Linux-only, so the crate still builds (with the kqueue backend) on
# macOS and the BSDs.
[target.'cfg(target_os = "linux")'.dependencies]
inotify = "0.10"
