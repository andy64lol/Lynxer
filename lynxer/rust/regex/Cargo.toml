[package]
name = "lynxer_regex"
version = "0.1.0"
edition = "2021"
description = "Extended regular-expression helpers with a named pattern cache for the Lynxer `regex` stdlib module"
publish = false

[lib]
name = "lynxer_regex"
crate-type = ["cdylib"]

[dependencies]
lynxer_abi = { path = "../abi" }
lynxer_regex_engine = { path = "../regex_engine" }
