[package]
name = "lynxer_raylib"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust backend for the Lynxer `raylib` stdlib module (raylib 6.0 bindings)"

[lib]
name = "lynxer_raylib"
crate-type = ["cdylib"]

[dependencies]
raylib-sys = { version = "6.0.0", features = ["WITH_PIC"] }
