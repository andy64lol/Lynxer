[package]
name = "lynxer_server"
version = "0.1.0"
edition = "2021"
description = "axum backend for the Lynxer `server` stdlib module"
publish = false

[lib]
name = "lynxer_server"
crate-type = ["cdylib"]

[dependencies]
lynxer_abi = { path = "../abi" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt", "net", "sync"] }
serde_json = "1"
percent-encoding = "2"
form_urlencoded = "1"
# TLS is pure Rust: `rustls` behind `axum-server`, with `rustls-pemfile` for the
# PEM files and `rcgen` for a self-signed certificate. The provider is `ring` --
# the one `ureq`/`tungstenite` already build in this workspace -- rather than
# rustls's default `aws-lc-rs`, whose `aws-lc-sys` needs CMake and a C compiler.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.14"
