[package]
name = "lynxer_stdlib"
version = "0.1.0"
edition = "2021"
description = "Rust standard-library backends for the Lynxer interpreter"
publish = false

# Every backend keeps its own crate root at `<module>/src/lib.rs`, so its `mod`
# tree and `crate::` paths are unchanged. Declaring each one as an example
# target with `crate-type = ["cdylib"]` still produces one shared library per
# module -- the interpreter keeps dlopening `stdlib/<name>.so`, one module at a
# time -- but a single `cargo build --examples` now builds all of them, and
# Cargo compiles the independent crate roots in parallel.
#
# `json` is deliberately not in this list. It is the only backend that needs
# `serde_json`'s `preserve_order` feature, and Cargo unifies features across
# every target in a package. Enabling it here would switch every other
# backend's `serde_json::Map` from a sorted map to an insertion-ordered one and
# change the JSON key order those modules emit (the XML/YAML/TOML fixtures pin
# it). It therefore stays a separate package, built by its own cargo
# invocation; see `json/Cargo.toml`.
[[example]]
name = "lynxer_compress"
path = "compress/src/lib.rs"
crate-type = ["cdylib"]
test = true

[[example]]
name = "lynxer_crypto"
path = "crypto/src/lib.rs"
crate-type = ["cdylib"]
test = true

