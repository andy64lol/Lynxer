[workspace]
resolver = "2"
members = ["abi", "compress", "crypto", "email", "encoding", "game", "graphics", "html", "image", "ini", "json", "lua", "markdown", "network", "pdf", "raylib", "re", "regex", "regex_engine", "server", "sound", "sqldb", "text", "toml", "tui", "uuid", "watch", "xml", "yaml", "ffi"]

# Every module is built by the lynxer Makefile with an explicit --target-dir
# (lynxer/build/rust), so this profile applies to the whole workspace.
[profile.release]
opt-level = 3
