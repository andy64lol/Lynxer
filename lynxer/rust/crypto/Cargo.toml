[package]
name = "lynxer_crypto"
version = "0.1.0"
edition = "2021"
description = "Hashes, HMAC, constant-time comparison, OS randomness and Ed25519 signatures for the Lynxer `crypto` stdlib module"
publish = false

[lib]
name = "lynxer_crypto"
crate-type = ["cdylib"]

[dependencies]
lynxer_abi = { path = "../abi" }
# Hash families, each a separate crate behind the shared `digest` trait.
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
sha3 = "0.10"
blake3 = "1"
digest = "0.10"
# Keyed hashing and constant-time comparison.
hmac = "0.12"
subtle = "2"
# OS entropy for the random helpers and Ed25519 key generation.
getrandom = "0.2"
# Byte/text encoding for the payloads that cross the module ABI.
base64 = "0.22"
hex = "0.4"
# Ed25519 signing and verification.
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
