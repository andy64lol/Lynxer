[package]
name = "bob"
version = "0.1.0"
edition = "2021"
description = "bob — the Lynxer package manager (named after bobcats, which are lynxes)"
publish = false

[[bin]]
name = "bob"
path = "src/main.rs"

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
