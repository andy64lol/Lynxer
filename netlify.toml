# Netlify build configuration for the git-connected "lynxer" site, whose base
# directory is the repo root. The registry lives in lynxer-registry/, so its
# functions and publish directory are given relative to the repo root.
#
# The equivalent config for running the Netlify CLI from inside
# lynxer-registry/ is lynxer-registry/netlify.toml.
[build]
  functions = "lynxer-registry/netlify/functions"
  publish = "lynxer-registry/public"

[[redirects]]
  from = "/api/resolve"
  to = "/.netlify/functions/resolve"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
