[package]
name = "clynxer_json"
version = "0.1.0"
edition = "2021"
description = "serde_json backend for the Clynxer `json` stdlib module"
publish = false

[lib]
name = "clynxer_json"
crate-type = ["cdylib"]

[dependencies]
clynxer_abi = { path = "../abi" }
serde = "1"
# preserve_order keeps object keys in insertion order, matching the previous
# nlohmann::ordered_json backend.
serde_json = { version = "1", features = ["preserve_order"] }
