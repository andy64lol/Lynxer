[package]
name = "clynxer_sqldb"
version = "0.1.0"
edition = "2021"
description = "Rust backend for the Clynxer `sqldb` stdlib module"

[lib]
name = "clynxer_sqldb"
crate-type = ["cdylib"]

[dependencies]
clynxer_abi = { path = "../abi" }
rusqlite = { version = "0.29", features = ["blob"] }
serde_json = "1"
base64 = "0.21"